  window.chrome = window.chrome || {};
  window.chrome.storage = {
    local: {
      get: async function (key) {
        var keys = Array.isArray(key) ? key : [key];
        var result = {};
        keys.forEach(function (name) {
          result[name] = store[name];
        });
        return result;

<script>
(function () {
  "use strict";
  var attempts = 0;

  function expandFirstRoute() {
    var button = document.querySelector(".route-card .button-expand");
    if (button) {
      if (button.getAttribute("aria-expanded") === "false") {
        button.click();
      }
      var app = document.getElementById("app");
      if (app) app.scrollTop = 0;
      return;
    }
    attempts += 1;
    if (attempts < 40) setTimeout(expandFirstRoute, 50);
  }

  setTimeout(expandFirstRoute, 50);
})();
</script>
