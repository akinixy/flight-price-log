<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>航班价格记录簿 · 大型促销磁贴</title>
<style>
  :root {
    --ink: #101e2b;
    --paper: #f4efe4;
    --muted: #b6afa2;
    --copper: #c97b3c;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 1400px;
    height: 560px;
    margin: 0;
    overflow: hidden;
  }
  body {
    color: var(--paper);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(circle at 86% 22%, rgba(201, 123, 60, 0.18), transparent 38%),
      radial-gradient(circle at 6% 94%, rgba(244, 239, 228, 0.05), transparent 32%),
      var(--ink);
  }
  .stage {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 610px;
    gap: 44px;
    align-items: center;
    width: 1400px;
    height: 560px;
    padding: 56px 64px;
  }
  .route {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.55;
  }
  .copy {
    position: relative;
    z-index: 1;
    max-width: 600px;
  }
  .brand {
    margin: 0 0 16px;
    color: var(--copper);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
    font-size: 58px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.035em;
  }
  .lede {
    max-width: 500px;
    margin: 22px 0 0;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.7;
  }
  .facts {
    display: flex;
    gap: 30px;
    max-width: 560px;
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid rgba(244, 239, 228, 0.14);
  }
  .facts b {
    display: block;
    color: var(--paper);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .facts span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
  }
  .note {
    margin: 28px 0 0;
    color: rgba(182, 175, 162, 0.72);
    font-size: 11px;
  }
  .shot {
    position: relative;
    z-index: 1;
    width: 610px;
    height: 430px;
    overflow: hidden;
    background: var(--paper);
    border: 1px solid rgba(244, 239, 228, 0.2);
    border-radius: 16px;
    box-shadow:
      0 28px 60px rgba(0, 0, 0, 0.42),
      0 6px 18px rgba(0, 0, 0, 0.22);
  }
  .shot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: top center;
    background: var(--paper);
  }
</style>
</head>
<body>
  <div class="stage">
    <svg class="route" viewBox="0 0 1400 560" aria-hidden="true">
      <path d="M 30 520 C 380 470, 760 260, 1360 50"
            fill="none" stroke="#c97b3c" stroke-width="1.5"
            stroke-linecap="round" stroke-dasharray="2 11" opacity="0.22"/>
      <circle cx="30" cy="520" r="4" fill="#c97b3c" opacity="0.4"/>
      <circle cx="1360" cy="50" r="4" fill="#c97b3c" opacity="0.4"/>
      <text x="42" y="546" fill="#c97b3c" opacity="0.45"
            font-family="Consolas, monospace" font-size="12" letter-spacing="3">SHA</text>
      <text x="1300" y="34" fill="#c97b3c" opacity="0.45"
            font-family="Consolas, monospace" font-size="12" letter-spacing="3">PEK</text>
    </svg>

    <div class="copy">
      <p class="brand">航班价格记录簿</p>
      <h1>每班价格<br>都有迹可循</h1>
      <p class="lede">按航班记录历史，按日期对比价格。所有数据只留在本机。</p>
      <div class="facts">
        <div><b>单航班趋势</b><span>价格变化逐条记录</span></div>
        <div><b>日期对比</b><span>同一航线不同日期</span></div>
        <div><b>本地存储</b><span>不上传，不发请求</span></div>
      </div>
      <p class="note">非官方扩展，与携程无关联</p>
    </div>

    <div class="shot">
      <img src="dashboard-screenshot-1.png" alt="航班价格记录簿仪表盘">
    </div>
  </div>
</body>
</html>
