<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>航班价格记录簿 · 小型促销磁贴</title>
<style>
  :root {
    --ink: #101e2b;
    --paper: #f4efe4;
    --muted: #b6afa2;
    --copper: #c97b3c;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 440px;
    height: 280px;
    margin: 0;
    overflow: hidden;
  }
  body {
    color: var(--paper);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(circle at 86% 16%, rgba(201, 123, 60, 0.2), transparent 38%),
      var(--ink);
  }
  .stage {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    width: 440px;
    height: 280px;
    padding: 30px 32px;
  }
  .copy { min-width: 0; }
  .brand {
    margin: 0 0 8px;
    color: var(--copper);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.03em;
  }
  .lede {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  .note {
    margin: 18px 0 0;
    color: rgba(182, 175, 162, 0.68);
    font-size: 9px;
  }
  .mark {
    flex: none;
    width: 88px;
    height: 88px;
    overflow: hidden;
    border: 1px solid rgba(244, 239, 228, 0.2);
    border-radius: 18px;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.32);
  }
  .mark img {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <p class="brand">航班价格记录簿</p>
      <h1>每班价格<br>记在本机</h1>
      <p class="lede">历史趋势与日期对比，<br>数据只留在本机。</p>
      <p class="note">非官方扩展，与携程无关联</p>
    </div>
    <div class="mark">
      <img src="logo-300.png" alt="航班价格记录簿 Logo">
    </div>
  </div>
</body>
</html>
