<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="virtual-time-budget" content="60000">
<title>自动滚动采集测试</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 14px; }
  #result { white-space: pre-wrap; }
  #result[data-result="fail"] { color: #b42318; }
  #scroller { height: 120px; overflow-y: auto; border: 1px solid #ccc; }
  .item { height: 50px; line-height: 50px; padding-left: 8px; }
</style>
</head>
<body>
<h1>自动滚动采集测试</h1>
<div id="scroller"></div>
<div id="result" data-result="fail">running</div>

<script src="src/content/autoscroll.js"></script>
<script>
(function () {
  "use strict";

  var passed = 0;
  var failures = [];
  var result = document.getElementById("result");

  function assertEqual(name, actual, expected) {
    if (JSON.stringify(actual) === JSON.stringify(expected)) {
      passed += 1;
    } else {
      failures.push(
        name + "：期望 " + JSON.stringify(expected) + "，实际 " + JSON.stringify(actual)
      );
    }
  }

  var currentStep = "start";
  function step(name) {
    currentStep = name;
    result.textContent = "running: " + name + "（已通过 " + passed + " 项）";
  }

  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  // delayMs 模拟携程接口响应时间：滚动触发后要过一会儿才追加下一批。
  // triggerRatio 用于模拟“还没到底就开始分批渲染”的页面。
  var scrollerCleanup = null;

  function buildScroller(options) {
    options = options || {};
    var scroller = document.getElementById("scroller");
    // 每个用例重建列表；先移除上一个用例的监听，避免旧批次混进新用例。
    if (scrollerCleanup) {
      scrollerCleanup();
      scrollerCleanup = null;
    }
    scroller.textContent = "";
    scroller.scrollTop = 0;
    var appended = 0;
    var total = options.total === undefined ? 16 : options.total;
    var batch = options.batch || 4;
    var delayMs = options.delayMs || 0;
    var enabled = options.enabled !== false;
    var triggerRatio = options.triggerRatio;
    var pending = false;

    function appendBatch(size) {
      for (var i = 0; i < size && appended < total; i += 1) {
        var item = document.createElement("div");
        item.className = "item";
        item.setAttribute("data-no", "CA" + (1000 + appended));
        appended += 1;
        scroller.appendChild(item);
      }
    }

    appendBatch(options.initial === undefined ? batch : options.initial);

    function onScroll() {
      if (!enabled || pending || appended >= total) return;
      var max = scroller.scrollHeight - scroller.clientHeight;
      var threshold = triggerRatio === undefined ? max : max * triggerRatio;
      if (scroller.scrollTop < threshold - 2) return;

      pending = true;
      var load = function () {
        appendBatch(batch);
        pending = false;
      };
      if (delayMs > 0) setTimeout(load, delayMs);
      else load();
    }

    scroller.addEventListener("scroll", onScroll);
    scrollerCleanup = function () {
      scroller.removeEventListener("scroll", onScroll);
    };

    return scroller;
  }

  function itemCount(node) {
    return node.querySelectorAll(".item").length;
  }

  async function run() {
    step("1-scroll-target");
    // 1. 找到滚动容器。
    var scroller = buildScroller();
    var target = CtripAutoScroll.findScrollTarget(scroller.querySelector(".item"));
    assertEqual("识别滚动容器", target === scroller, true);

    step("2-full-collect");
    // 2. 分四批全部采集，结束后恢复滚动位置。
    scroller.scrollTop = 0;
    var outcome = await CtripAutoScroll.collect({
      target: target,
      listNode: scroller,
      count: function () { return itemCount(scroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 400,
      idleRounds: 2,
      maxRounds: 40,
      restoreDurationMs: 50,
      respectUserInput: false,
    });
    assertEqual("采集到全部条目", outcome.count, 16);
    assertEqual("因空闲结束", outcome.stopped, "idle");
    assertEqual("结束时恢复滚动位置", scroller.scrollTop, 0);

    step("2b-tall-initial");
    // 2b. 初始列表高于可视区域时，也必须继续滚到底再触发懒加载。
    var tallScroller = buildScroller({ total: 16, batch: 4, initial: 12 });
    var tallOutcome = await CtripAutoScroll.collect({
      target: tallScroller,
      listNode: tallScroller,
      count: function () { return itemCount(tallScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 100,
      idleRounds: 2,
      maxRounds: 40,
      respectUserInput: false,
    });
    assertEqual("初始高列表采全", tallOutcome.count, 16);
    assertEqual("初始高列表因空闲结束", tallOutcome.stopped, "idle");
    assertEqual("初始高列表恢复滚动位置", tallScroller.scrollTop, 0);

    step("2c-large-batch");
    // 2c. 单批新增高度远超一屏时，也要继续滚到新底部。
    var bigBatchScroller = buildScroller({ total: 20, batch: 12, initial: 4 });
    var bigBatchOutcome = await CtripAutoScroll.collect({
      target: bigBatchScroller,
      listNode: bigBatchScroller,
      count: function () { return itemCount(bigBatchScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 100,
      idleRounds: 2,
      maxRounds: 40,
      respectUserInput: false,
    });
    assertEqual("大批次采全", bigBatchOutcome.count, 20);
    assertEqual("大批次因空闲结束", bigBatchOutcome.stopped, "idle");
    assertEqual("大批次恢复滚动位置", bigBatchScroller.scrollTop, 0);

    step("3-slow");
    // 3. 接口响应慢于单帧时也要等到，不能误判为没有更多。
    var slowScroller = buildScroller({ delayMs: 80, total: 16, batch: 4 });
    var slowOutcome = await CtripAutoScroll.collect({
      target: slowScroller,
      listNode: slowScroller,
      count: function () { return itemCount(slowScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 300,
      idleRounds: 2,
      maxRounds: 40,
      respectUserInput: false,
    });
    assertEqual("慢接口采集完整", slowOutcome.count, 16);
    assertEqual("慢接口正常结束", slowOutcome.stopped, "idle");

    step("4-growth-during-glide");
    // 4. 列表在滚动途中分批增长（还没到底就追加）时，连续滚动不应停下。
    var growScroller = buildScroller({ total: 16, batch: 4, triggerRatio: 0.5 });
    var growOutcome = await CtripAutoScroll.collect({
      target: growScroller,
      listNode: growScroller,
      count: function () { return itemCount(growScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 100,
      idleRounds: 2,
      maxRounds: 40,
      respectUserInput: false,
    });
    assertEqual("滚动中增长也能采全", growOutcome.count, 16);
    assertEqual("滚动中增长正常结束", growOutcome.stopped, "idle");

    step("5-on-progress");
    // 5. 连续滚动途中定期回调，便于边滚边合并已渲染的航班。
    var progressScroller = buildScroller({ total: 16, batch: 4 });
    var progressCalls = 0;
    var progressTimes = [];
    await CtripAutoScroll.collect({
      target: progressScroller,
      listNode: progressScroller,
      count: function () { return itemCount(progressScroller); },
      speedPxPerSec: 400,
      stepTimeoutMs: 100,
      idleRounds: 2,
      maxRounds: 40,
      progressIntervalMs: 60,
      respectUserInput: false,
      onProgress: function () {
        progressCalls += 1;
        progressTimes.push(Date.now());
      },
    });
    var minProgressGap = Infinity;
    for (var pg = 1; pg < progressTimes.length; pg += 1) {
      minProgressGap = Math.min(minProgressGap, progressTimes[pg] - progressTimes[pg - 1]);
    }
    assertEqual("滚动中多次回调合并", progressCalls >= 3, true);
    assertEqual("进度回调按间隔节流", minProgressGap >= 45, true);
    assertEqual("进度回调次数有上限", progressCalls <= 40, true);

    step("6-user-interrupt");
    // 6. 用户操作优先：采集过程中用户滚动页面应立即让出控制权，且不拉回原位。
    var userScroller = buildScroller({ total: 40, batch: 4 });
    var userRun = CtripAutoScroll.collect({
      target: userScroller,
      listNode: userScroller,
      count: function () { return itemCount(userScroller); },
      speedPxPerSec: 300,
      stepTimeoutMs: 300,
      idleRounds: 2,
      maxRounds: 40,
    });
    await wait(30);
    userScroller.scrollTop = 37;
    window.dispatchEvent(new WheelEvent("wheel", { deltaY: 120 }));
    var userOutcome = await userRun;
    assertEqual("用户操作后中断", userOutcome.stopped, "user-interrupted");
    assertEqual("中断后不拉回滚动位置", userScroller.scrollTop, 37);

    step("7-static");
    // 7. 没有新增内容时尽快结束。
    var staticScroller = buildScroller({ enabled: false });
    var staticOutcome = await CtripAutoScroll.collect({
      target: staticScroller,
      listNode: staticScroller,
      count: function () { return itemCount(staticScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 60,
      idleRounds: 2,
      maxRounds: 30,
      respectUserInput: false,
    });
    assertEqual("静态列表数量不变", staticOutcome.count, 4);
    assertEqual("静态列表提前结束", staticOutcome.stopped, "idle");

    step("8-external-stop");
    // 8. URL 变化等外部中断信号生效，且不拉回滚动位置。
    var interruptScroller = buildScroller();
    interruptScroller.scrollTop = 25;
    var interrupted = await CtripAutoScroll.collect({
      target: interruptScroller,
      listNode: interruptScroller,
      count: function () { return itemCount(interruptScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 60,
      idleRounds: 5,
      maxRounds: 30,
      respectUserInput: false,
      shouldStop: function () { return true; },
    });
    assertEqual("外部中断时停止", interrupted.stopped, "interrupted");
    assertEqual("外部中断时不拉回滚动位置", interruptScroller.scrollTop, 25);

    step("9-max-rounds");
    // 9. 底部轮数上限生效（模拟每批都要等待的页面）。
    var capScroller = buildScroller({ total: 400, batch: 4, delayMs: 50 });
    var capped = await CtripAutoScroll.collect({
      target: capScroller,
      listNode: capScroller,
      count: function () { return itemCount(capScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 200,
      idleRounds: 10,
      maxRounds: 1,
      respectUserInput: false,
    });
    assertEqual("达到轮数上限", capped.stopped, "max-rounds");

    step("9d-continuous");
    // 9d. 中段连续滚动：不应出现“动画一段、停一段”的节奏。
    var contScroller = buildScroller({ total: 20, batch: 20, enabled: false });
    var tops = [];
    var sampler = setInterval(function () {
      tops.push(contScroller.scrollTop);
    }, 20);
    var contOutcome = await CtripAutoScroll.collect({
      target: contScroller,
      listNode: contScroller,
      count: function () { return itemCount(contScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 60,
      idleRounds: 2,
      maxRounds: 10,
      respectUserInput: false,
    });
    clearInterval(sampler);
    // 忽略结束时的回滚：出现明显后退就截断。
    var usable = [];
    for (var t = 0; t < tops.length; t += 1) {
      if (t > 0 && tops[t] < tops[t - 1] - 2) break;
      usable.push(tops[t]);
    }
    var longestFlat = 0;
    var flatRun = 0;
    var maxTop = 0;
    for (var m = 0; m < usable.length; m += 1) {
      if (usable[m] > maxTop) maxTop = usable[m];
    }
    for (var f = 1; f < usable.length; f += 1) {
      // 只统计中段；底部的等待期本来就不动。
      if (usable[f] === usable[f - 1] && usable[f] < maxTop - 2) {
        flatRun += 1;
        if (flatRun > longestFlat) longestFlat = flatRun;
      } else {
        flatRun = 0;
      }
    }
    // 中段必须出现足够多的递增位置，才能排除“瞬移到底”或“大步跳跃”。
    var midDistinct = 0;
    var maxJump = 0;
    for (var d = 1; d < usable.length; d += 1) {
      var delta = usable[d] - usable[d - 1];
      if (delta > 0) {
        if (delta > maxJump) maxJump = delta;
        if (usable[d] < maxTop - 2) midDistinct += 1;
      }
    }
    assertEqual("连续滚动采全", contOutcome.count, 20);
    assertEqual("连续滚动正常结束", contOutcome.stopped, "idle");
    assertEqual("中段有足够多的滚动采样", midDistinct >= 20, true);
    assertEqual("没有瞬移式跳变", maxJump <= 150, true);
    // 每个采样点间隔约 20ms；分段实现每步会停顿 100ms 以上。
    assertEqual("中段最长停顿不超过 2 个采样点", longestFlat <= 2, true);

    step("9e-budget-cap");
    // 9e. 总时长预算耗尽时停止，并恢复滚动位置。
    var budgetCapScroller = buildScroller({ total: 400, batch: 4 });
    var budgetCapped = await CtripAutoScroll.collect({
      target: budgetCapScroller,
      listNode: budgetCapScroller,
      count: function () { return itemCount(budgetCapScroller); },
      speedPxPerSec: 400,
      stepTimeoutMs: 20,
      idleRounds: 10,
      maxRounds: 20,
      maxDurationMs: 100,
      respectUserInput: false,
    });
    assertEqual("预算耗尽按超时结束", budgetCapped.stopped, "timeout");
    assertEqual("预算结束恢复滚动位置", budgetCapScroller.scrollTop, 0);

    step("10-describe");
    // 10. 总时长预算用假时钟验证，正常结束仍恢复滚动位置。
    var budgetScroller = buildScroller({ total: 400, batch: 4, delayMs: 10 });
    var fakeClock = 0;
    var budgetOutcome = await CtripAutoScroll.collect({
      target: budgetScroller,
      listNode: budgetScroller,
      count: function () { return itemCount(budgetScroller); },
      speedPxPerSec: 400,
      stepTimeoutMs: 30,
      idleRounds: 10,
      maxRounds: 100,
      maxDurationMs: 50,
      now: function () {
        fakeClock += 30;
        return fakeClock;
      },
      respectUserInput: false,
    });
    assertEqual("达到总时长预算", budgetOutcome.stopped, "timeout");
    assertEqual("预算结束恢复滚动位置", budgetScroller.scrollTop, 0);

    // 10b. 同时识别祖先与列表内部的可滚动容器。
    var outer = document.createElement("div");
    outer.style.cssText = "height:120px;overflow-y:auto;";
    var inner = document.createElement("div");
    inner.style.cssText = "height:100px;overflow-y:auto;";
    var innerContent = document.createElement("div");
    innerContent.style.height = "300px";
    inner.appendChild(innerContent);
    var spacer = document.createElement("div");
    spacer.style.height = "200px";
    outer.appendChild(inner);
    outer.appendChild(spacer);
    document.body.appendChild(outer);
    var nestedTargets = CtripAutoScroll.findScrollTargets(inner);
    assertEqual(
      "识别嵌套滚动容器",
      nestedTargets.indexOf(inner) >= 0 && nestedTargets.indexOf(outer) >= 0,
      true
    );
    outer.remove();

    var wrapper = document.createElement("div");
    wrapper.className = "result-wrapper";
    var innerScroller = document.createElement("div");
    innerScroller.style.cssText = "height:80px;overflow-y:auto;";
    var flightItem = document.createElement("div");
    flightItem.className = "flight-item";
    flightItem.style.height = "200px";
    innerScroller.appendChild(flightItem);
    wrapper.appendChild(innerScroller);
    document.body.appendChild(wrapper);
    var descendantTargets = CtripAutoScroll.findScrollTargets(wrapper);
    assertEqual(
      "识别列表内部滚动容器",
      descendantTargets.indexOf(innerScroller) >= 0,
      true
    );
    wrapper.remove();

    // 10c. 描述滚动容器，便于在真实页面排查。
    var described = CtripAutoScroll.describeTarget(scroller);
    assertEqual("描述包含标签名", described.indexOf("div") === 0, true);
    assertEqual("描述包含 id", described.indexOf("#scroller") >= 0, true);

    step("12-no-mid-pause");
    // 12. 高列表一路滚到底，不允许每步停下等待。
    var tallStartedAt = Date.now();
    var tallScroller = buildScroller({ total: 20, batch: 20, enabled: false });
    var tallOutcome = await CtripAutoScroll.collect({
      target: tallScroller,
      listNode: tallScroller,
      count: function () { return itemCount(tallScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 100,
      idleRounds: 2,
      maxRounds: 30,
      respectUserInput: false,
    });
    assertEqual("高列表仍采全", tallOutcome.count, 20);
    assertEqual("高列表正常结束", tallOutcome.stopped, "idle");
    assertEqual(
      "中段不逐轮等待超时",
      Date.now() - tallStartedAt < 2500,
      true
    );

    step("13-bottom-idle");
    // 13. 到底后由页面决定是否还有更多；回调点击一次后继续采集。
    var bottomScroller = buildScroller({ total: 4, batch: 4, enabled: false });
    var loadMoreCalls = 0;
    var bottomOutcome = await CtripAutoScroll.collect({
      target: bottomScroller,
      listNode: bottomScroller,
      count: function () { return itemCount(bottomScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 80,
      idleRounds: 2,
      maxRounds: 30,
      respectUserInput: false,
      onBottomIdle: function () {
        if (loadMoreCalls > 0) return false;
        loadMoreCalls += 1;
        for (var i = 0; i < 4; i += 1) {
          var item = document.createElement("div");
          item.className = "item";
          bottomScroller.appendChild(item);
        }
        return true;
      },
    });
    assertEqual("底部只点击一次加载更多", loadMoreCalls, 1);
    assertEqual("加载更多后继续采集", bottomOutcome.count, 8);
    assertEqual("加载更多后正常结束", bottomOutcome.stopped, "idle");

    step("14-glide-target");
    // 14. 连续滚动函数单独可用：到达底部后返回 bottom。
    var glideScroller = buildScroller({ total: 8, batch: 8, enabled: false });
    var glideReason = await CtripAutoScroll.glideToBottom([glideScroller], {
      speedPxPerSec: 600,
      deadline: Date.now() + 5000,
    });
    assertEqual("连续滚动到达底部", glideReason, "bottom");
    assertEqual(
      "连续滚动停在底部",
      glideScroller.scrollTop + glideScroller.clientHeight >=
        glideScroller.scrollHeight - 2,
      true
    );

    step("15-height-growth");
    // 15. 只增高、不新增节点的懒加载也要算作新内容并继续滚到底。
    var heightScroller = buildScroller({ total: 4, batch: 4, enabled: false });
    var spacer = document.createElement("div");
    spacer.style.height = "0px";
    heightScroller.appendChild(spacer);
    var heightGrows = 0;
    var heightBatches = 0;
    function onHeightScroll(event) {
      // 只响应扩展补发的合成事件，确保底部的 notifyScroll 真的生效。
      if (event && event.isTrusted) return;
      if (heightGrows >= 2) return;
      var atBottom =
        heightScroller.scrollTop + heightScroller.clientHeight >=
        heightScroller.scrollHeight - 2;
      if (!atBottom) return;
      heightGrows += 1;
      spacer.style.height = heightGrows * 100 + "px";
    }
    heightScroller.addEventListener("scroll", onHeightScroll);
    var heightOutcome = await CtripAutoScroll.collect({
      target: heightScroller,
      listNode: heightScroller,
      count: function () { return itemCount(heightScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 100,
      idleRounds: 2,
      maxRounds: 30,
      respectUserInput: false,
      onBatch: function () { heightBatches += 1; },
    });
    heightScroller.removeEventListener("scroll", onHeightScroll);
    assertEqual("高度增长触发两次加载", heightGrows, 2);
    assertEqual("高度增长按批次合并", heightBatches, 2);
    assertEqual("高度增长后正常结束", heightOutcome.stopped, "idle");

    step("16-multi-target");
    // 16. 多个滚动容器（内层列表 + 文档）都要滚动，并且都恢复原位。
    var outerBox = document.createElement("div");
    outerBox.style.cssText = "height:120px;overflow-y:auto;";
    var outerContent = document.createElement("div");
    outerContent.style.height = "400px";
    outerBox.appendChild(outerContent);
    var innerBox = document.createElement("div");
    innerBox.style.cssText = "height:100px;overflow-y:auto;";
    var innerContent = document.createElement("div");
    innerContent.style.height = "300px";
    innerBox.appendChild(innerContent);
    document.body.appendChild(outerBox);
    document.body.appendChild(innerBox);
    var outerMaxTop = 0;
    var innerMaxTop = 0;
    function recordOuterTop() {
      if (outerBox.scrollTop > outerMaxTop) outerMaxTop = outerBox.scrollTop;
    }
    function recordInnerTop() {
      if (innerBox.scrollTop > innerMaxTop) innerMaxTop = innerBox.scrollTop;
    }
    outerBox.addEventListener("scroll", recordOuterTop);
    innerBox.addEventListener("scroll", recordInnerTop);
    var multiOutcome = await CtripAutoScroll.collect({
      targets: [innerBox, outerBox],
      listNode: innerBox,
      count: function () { return 0; },
      speedPxPerSec: 600,
      stepTimeoutMs: 60,
      idleRounds: 2,
      maxRounds: 10,
      respectUserInput: false,
    });
    outerBox.removeEventListener("scroll", recordOuterTop);
    innerBox.removeEventListener("scroll", recordInnerTop);
    assertEqual("多容器都滚动到底部", outerMaxTop >= 278 && innerMaxTop >= 198, true);
    assertEqual("多容器都恢复原位", outerBox.scrollTop === 0 && innerBox.scrollTop === 0, true);
    assertEqual("多容器正常结束", multiOutcome.stopped, "idle");
    outerBox.remove();
    innerBox.remove();

    step("17-interrupt-in-wait");
    // 17. 到达底部后的等待期里用户操作，也要在一个轮询周期内中断且不拉回。
    var waitScroller = buildScroller({ total: 4, batch: 4, enabled: false });
    var waitRun = CtripAutoScroll.collect({
      target: waitScroller,
      listNode: waitScroller,
      count: function () { return itemCount(waitScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 1000,
      idleRounds: 2,
      maxRounds: 10,
    });
    await wait(400);
    var interruptAt = Date.now();
    waitScroller.scrollTop = 33;
    window.dispatchEvent(new WheelEvent("wheel", { deltaY: 120 }));
    var waitOutcome = await waitRun;
    var interruptElapsed = Date.now() - interruptAt;
    assertEqual("等待期用户操作也中断", waitOutcome.stopped, "user-interrupted");
    assertEqual("等待期中断及时生效", interruptElapsed < 500, true);
    assertEqual("等待期中断不拉回位置", waitScroller.scrollTop, 33);

    step("18-stop-mid-glide");
    // 18. 滚动途中外部条件变化（如 URL 切换）立即停止，且不恢复位置。
    var stopScroller = buildScroller({ total: 20, batch: 20, enabled: false });
    var stopFlag = false;
    setTimeout(function () { stopFlag = true; }, 250);
    var stopOutcome = await CtripAutoScroll.collect({
      target: stopScroller,
      listNode: stopScroller,
      count: function () { return itemCount(stopScroller); },
      speedPxPerSec: 300,
      stepTimeoutMs: 100,
      idleRounds: 2,
      maxRounds: 10,
      respectUserInput: false,
      shouldStop: function () { return stopFlag; },
    });
    assertEqual("滚动途中外部停止", stopOutcome.stopped, "interrupted");
    assertEqual("外部停止时不恢复位置", stopScroller.scrollTop > 0, true);

    step("19-bottom-fill");
    // 19. 到底后新批次只是填满已有空白（列表高度不变）时，合并后直接结束，不再等第二轮。
    var fillScroller = buildScroller({ total: 4, batch: 4, enabled: false });
    var fillSpacer = document.createElement("div");
    fillSpacer.style.height = "400px";
    fillScroller.appendChild(fillSpacer);
    var fillDone = false;
    function onFillScroll(event) {
      if (event && event.isTrusted) return;
      if (fillDone) return;
      var atBottom =
        fillScroller.scrollTop + fillScroller.clientHeight >=
        fillScroller.scrollHeight - 2;
      if (!atBottom) return;
      fillDone = true;
      for (var i = 0; i < 4; i += 1) {
        var item = document.createElement("div");
        item.className = "item";
        fillScroller.appendChild(item);
      }
      // 同步减少占位高度，保持 scrollHeight 不变。
      fillSpacer.style.height = "200px";
    }
    fillScroller.addEventListener("scroll", onFillScroll);
    var fillOutcome = await CtripAutoScroll.collect({
      target: fillScroller,
      listNode: fillScroller,
      count: function () { return itemCount(fillScroller); },
      speedPxPerSec: 600,
      stepTimeoutMs: 120,
      idleRounds: 1,
      maxRounds: 10,
      respectUserInput: false,
    });
    fillScroller.removeEventListener("scroll", onFillScroll);
    assertEqual("底部填充后采到新条目", fillOutcome.count, 8);
    assertEqual("底部填充后正常结束", fillOutcome.stopped, "idle");
    assertEqual("底部填充后只等一轮", fillOutcome.rounds, 1);
    assertEqual("底部填充后恢复原位", fillScroller.scrollTop, 0);
  }

  run()
    .then(function () {
      if (failures.length) {
        result.setAttribute("data-result", "fail");
        result.textContent =
          "FAIL: " + failures.length + " 项失败\n" + failures.join("\n");
      } else {
        result.setAttribute("data-result", "pass");
        result.textContent = "PASS: " + passed;
      }
    })
    .catch(function (error) {
      result.setAttribute("data-result", "fail");
      result.textContent =
        "FAIL: " + (error && error.message ? error.message : String(error));
    });
})();
</script>
</body>
</html>
